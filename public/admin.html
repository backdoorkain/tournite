<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Organizador</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b111e; color: #ffffff; padding: 30px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #4f46e5; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .card { background-color: #151f32; border: 1px solid #223452; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { font-size: 18px; margin-bottom: 15px; color: #38bdf8; border-bottom: 1px solid #223452; padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; background-color: #0b111e; border: 1px solid #223452; border-radius: 6px; color: white; font-size: 14px; }
        .btn { padding: 10px 15px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; width: 100%; transition: filter 0.2s; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-green { background: #10b981; color: white; }
        .btn-red { background: #ef4444; color: white; margin-top: 15px; }
        .btn:hover { filter: brightness(1.2); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #223452; }
        th { background-color: #0b111e; color: #94a3b8; text-transform: uppercase; font-size: 11px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Panel de Administración</h1>
        
        <div class="grid">
            <!-- CONFIGURACIÓN GLOBAL -->
            <div class="card">
                <h2>Ajustes del Torneo</h2>
                <div class="form-group">
                    <label>Estado de Inscripción</label>
                    <select id="config-estado">
                        <option value="CERRADO">Cerrado / En Curso</option>
                        <option value="ABIERTO">Abierto para Registros</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Límite de Cupos (Jugadores)</label>
                    <input type="number" id="config-limite" value="20">
                </div>
                <div class="form-group">
                    <label>Clave de la Sala Privada</label>
                    <input type="text" id="config-clave" placeholder="Ej. SALA_PRO">
                </div>
                <button class="btn btn-blue" onclick="guardarConfig()">Actualizar Ajustes</button>
            </div>

            <!-- INYECTAR JUGADORES FICTICIOS -->
            <div class="card">
                <h2>Simulador de Participantes</h2>
                <p style="color:#94a3b8; font-size:13px; margin-bottom:15px;">Inyecta bots o simula cobros para probar el portal y los premios acumulados.</p>
                <div class="form-group">
                    <label>ID de Epic Games Ficticio</label>
                    <input type="text" id="bot-id" placeholder="Ej. PlayerBot_01">
                </div>
                <div class="form-group">
                    <label>Monto Simulado Pagado ($ USD)</label>
                    <input type="number" id="bot-monto" value="5.00" step="0.01">
                </div>
                <button class="btn btn-green" onclick="inyectarBot()">Inyectar Participante</button>
            </div>
        </div>

        <!-- TABLA DE JUGADORES Y PUNTAJES -->
        <div class="card" style="margin-bottom: 30px;">
            <h2>Control de Puntajes (Posiciones Manuales)</h2>
            <table>
                <thead>
                    <tr>
                        <th>Epic ID</th>
                        <th>Pago ($)</th>
                        <th>Partida 1 (Pos)</th>
                        <th>Partida 2 (Pos)</th>
                        <th>Partida 3 (Pos)</th>
                        <th>Total Pts</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-admin-jugadores">
                    <!-- Se llena automáticamente con Javascript -->
                </tbody>
            </table>
            <button class="btn btn-red" onclick="resetearTorneo()">Resetear Todo el Torneo (Borrar Datos)</button>
        </div>
    </div>

    <script>
        async function cargarStatus() {
            const response = await fetch('/api/admin/status');
            const data = await response.json();
            
            document.getElementById('config-estado').value = data.estado;
            document.getElementById('config-limite').value = data.limite;
            document.getElementById('config-clave').value = data.clave;

            const tbody = document.getElementById('tabla-admin-jugadores');
            tbody.innerHTML = "";

            data.jugadores.forEach(j => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${j.epic_id}</strong></td>
                        <td>$${j.monto_pago.toFixed(2)}</td>
                        <td><input type="number" style="width:60px" id="p1-${j.epic_id}" value="${j.p1_pos}"></td>
                        <td><input type="number" style="width:60px" id="p2-${j.epic_id}" value="${j.p2_pos}"></td>
                        <td><input type="number" style="width:60px" id="p3-${j.epic_id}" value="${j.p3_pos}"></td>
                        <td style="color:#38bdf8; font-weight:bold;">${j.puntos_totales} pts</td>
                        <td><button class="btn btn-blue" style="padding:5px; font-size:12px;" onclick="guardarPuntos('${j.epic_id}')">Guardar</button></td>
                    </tr>
                `;
            });
        }

        async function guardarConfig() {
            await fetch('/api/admin/configurar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    estado: document.getElementById('config-estado').value,
                    limite: document.getElementById('config-limite').value,
                    clave: document.getElementById('config-clave').value
                })
            });
            alert("Ajustes globales actualizados");
            cargarStatus();
        }

        async function inyectarBot() {
            const epic_id = document.getElementById('bot-id').value;
            const monto = document.getElementById('bot-monto').value;
            if(!epic_id) return alert("Escribe un ID");

            await fetch('/api/admin/inyectar-jugador', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ epic_id, monto })
            });
            document.getElementById('bot-id').value = "";
            cargarStatus();
        }

        async function guardarPuntos(epic_id) {
            await fetch('/api/admin/actualizar-puntos', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    epic_id,
                    p1_pos: document.getElementById(`p1-${epic_id}`).value,
                    p2_pos: document.getElementById(`p2-${epic_id}`).value,
                    p3_pos: document.getElementById(`p3-${epic_id}`).value
                })
            });
            cargarStatus();
        }

        async function resetearTorneo() {
            if(confirm("¿Estás completamente seguro? Esto eliminará a todos los jugadores registrados y bots.")){
                await fetch('/api/admin/reset-todo', { method: 'POST' });
                cargarStatus();
            }
        }

        // Carga los datos inmediatamente al abrir la página
        cargarStatus();
    </script>
</body>
</html>
