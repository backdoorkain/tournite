<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo Fortnite - Inscripción</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b111e; /* Fondo azul oscuro profundo */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #151f32; /* Azul oscuro secundario para la tarjeta */
            border: 1px solid #223452;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #4f46e5; /* Acento azul eléctrico */
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .price-box {
            background-color: #0b111e;
            border: 1px dashed #4f46e5;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 28px;
        }

        .price-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .price-amount {
            font-size: 28px;
            font-weight: 800;
            color: #38bdf8; /* Azul claro brillante para el precio */
            margin-top: 4px;
        }

        .stripe-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); /* Degradado azul */
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.3);
        }

        .stripe-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .stripe-btn:active {
            transform: translateY(1px);
        }
        
        .error-banner {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Fase de Registro</h1>
        <p class="subtitle">Asegura tu cupo en la partida privada</p>
        
        <!-- BANNER DE ERROR EN CASO DE FALLO -->
        <div id="error-msg" class="error-banner"></div>
        
        <div class="price-box">
            <p class="price-label">Costo de Entrada</p>
            <p class="price-amount">$5.00 USD</p>
        </div>
        
        <!-- BOTÓN DE STRIPE (TARJETA BANCO Y GOOGLE PAY) -->
        <button id="checkout-button" class="stripe-btn">
            Pagar con Tarjeta Bancaria
        </button>
    </div>

    <script>
        // Detectar si venimos de un error de pago fallido
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error')) {
            const errorDiv = document.getElementById('error-msg');
            errorDiv.innerText = "Hubo un problema al procesar el pago. Inténtalo de nuevo.";
            errorDiv.style.display = 'block';
        }

        // Lógica de redirección a la pasarela segura de Stripe
        document.getElementById('checkout-button').addEventListener('click', async () => {
            try {
                const response = await fetch('/create-checkout-session', { method: 'POST' });
                const data = await response.json();
                
                if (data.url) {
                    window.location.href = data.url; // Redirige directamente al entorno de Stripe
                } else {
                    alert(data.error || "Error al generar la pasarela de pago");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Hubo un problema de conexión con el servidor.");
            }
        });
    </script>

</body>
</html>
