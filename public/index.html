<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo Fortnite - Acceso</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b111e; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-container { background-color: #151f32; border: 1px solid #223452; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        .tabs { display: flex; border-bottom: 1px solid #223452; background-color: #0e1726; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; color: #94a3b8; font-weight: 600; cursor: pointer; text-transform: uppercase; font-size: 13px; transition: all 0.2s; }
        .tab-btn.active { color: #38bdf8; border-bottom: 2px solid #4f46e5; background-color: #151f32; }
        .form-wrapper { padding: 30px; }
        .form-content { display: none; }
        .form-content.active { display: block; }
        h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: #ffffff; text-transform: uppercase; text-align: center; }
        .subtitle { color: #94a3b8; font-size: 13px; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        input { width: 100%; padding: 12px; background-color: #0b111e; border: 1px solid #223452; border-radius: 6px; color: white; font-size: 14px; transition: border 0.2s; }
        input:focus { outline: none; border-color: #4f46e5; }
        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%); color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; text-transform: uppercase; transition: filter 0.2s; margin-top: 10px; }
        .btn-submit:hover { filter: brightness(1.1); }
        .error-msg { color: #ef4444; font-size: 13px; margin-top: 15px; text-align: center; display: none; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 6px; border: 1px solid rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="tabs">
            <button id="btn-tab-login" class="tab-btn active" onclick="switchTab('login')">Ingresar</button>
            <button id="btn-tab-register" class="tab-btn" onclick="switchTab('register')">Registrarse</button>
        </div>
        
        <div class="form-wrapper">
            <!-- INICIO DE SESIÓN -->
            <div id="login-form" class="form-content active">
                <h2>Iniciar Sesión</h2>
                <p class="subtitle">Ingresa al portal del torneo</p>
                <form onsubmit="handleAuth(event, '/api/login', 'login-error')">
                    <div class="form-group">
                        <label>ID de Epic Games</label>
                        <input type="text" name="epic_id" required placeholder="Ej. Ninja">
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" name="password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn-submit">Entrar al Portal</button>
                    <div id="login-error" class="error-msg"></div>
                </form>
            </div>

            <!-- REGISTRO -->
            <div id="register-form" class="form-content">
                <h2>Crear Cuenta</h2>
                <p class="subtitle">Registra tu ID para el torneo</p>
                <form onsubmit="handleAuth(event, '/api/registrar', 'register-error')">
                    <div class="form-group">
                        <label>ID de Epic Games Oficial</label>
                        <input type="text" name="epic_id" required placeholder="Tu ID exacto del juego">
                    </div>
                    <div class="form-group">
                        <label>Contraseña del Sitio</label>
                        <input type="password" name="password" required placeholder="Crea una contraseña">
                    </div>
                    <button type="submit" class="btn-submit">Registrar e Inscribirse</button>
                    <div id="register-error" class="error-msg"></div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function switchTab(type) {
            const tabLogin = document.getElementById('btn-tab-login');
            const tabRegister = document.getElementById('btn-tab-register');
            const formLogin = document.getElementById('login-form');
            const formRegister = document.getElementById('register-form');

            tabLogin.classList.remove('active');
            tabRegister.classList.remove('active');
            formLogin.classList.remove('active');
            formRegister.classList.remove('active');
            
            if(type === 'login') {
                tabLogin.classList.add('active');
                formLogin.classList.add('active');
            } else {
                tabRegister.classList.add('active');
                formRegister.classList.add('active');
            }
        }

        async function handleAuth(event, endpoint, errorId) {
            event.preventDefault();
            const errorDiv = document.getElementById(errorId);
            errorDiv.style.display = 'none';

            const formData = new FormData(event.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const resData = await response.json();

                if (response.ok && resData.redirect) {
                    window.location.href = resData.redirect;
                } else {
                    errorDiv.innerText = resData.error || "Ocurrió un error inesperado.";
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.innerText = "Error de conexión con el servidor.";
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
