<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Torneo Fortnite - Inscripción</title>
</head>
<body>
    <h1>Inscripción al Torneo</h1>
    <p>Costo de entrada: $5.00 USD</p>
    <button id="checkout-button">Pagar Entrada</button>

    <script>
        const checkoutButton = document.getElementById('checkout-button');

        checkoutButton.addEventListener('click', async () => {
            try {
                const response = await fetch('/create-checkout-session', { method: 'POST' });
                const data = await response.json();
                
                if (data.url) {
                    // CAMBIO IMPORTANTE: Redirección directa del navegador
                    window.location.href = data.url; 
                } else {
                    alert("Error al generar la pasarela de pago");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Hubo un problema de conexión con el servidor.");
            }
        });
    </script>
</body>
</html>
