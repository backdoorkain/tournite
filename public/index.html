<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Torneo Fortnite - Inscripción</title>
    <!-- Cargamos la librería oficial de Stripe en el cliente -->
    <script src="https://stripe.com"></script>
</head>
<body>
    <h1>Inscripción al Torneo</h1>
    <p>Costo de entrada: $5.00 USD</p>
    <button id="checkout-button">Pagar Entrada</button>

    <script>
        // Reemplaza con tu Clave Ejecutable de Stripe (pk_test_...)
        const stripe = Stripe('pk_test_51TjkQlCAgpn6yQVK9TRCDiJEEOythM8k376RUDg2kRO4SURf6mGr7G7FZ06ItxsGICy2fzWS2bwUgaF8tHUDjP1j00RE3CXKVX');
        const checkoutButton = document.getElementById('checkout-button');

        checkoutButton.addEventListener('click', async () => {
            const response = await fetch('/create-checkout-session', { method: 'POST' });
            const session = await response.json();
            
            // Redirige automáticamente a la pasarela segura de Stripe
            const result = await stripe.redirectToCheckout({ sessionId: session.id });
            if (result.error) alert(result.error.message);
        });
    </script>
</body>
</html>
