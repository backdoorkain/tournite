<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tu Clave de Acceso</title>
</head>
<body>
    <h1>Verificando tu pago...</h1>
    <div id="resultado"></div>

    <script>
        async function verificarPago() {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session_id');
            const resultadoDiv = document.getElementById('resultado');

            if (!sessionId) {
                resultadoDiv.innerHTML = "<p style='color:red;'>Acceso denegado. No se encontró ID de sesión.</p>";
                return;
            }

            // Preguntamos al servidor si ese ID realmente pagó
            const response = await fetch(`/verify-session?session_id=${sessionId}`);
            const data = await response.json();

            if (data.success) {
                document.querySelector('h1').innerText = "¡Pago Confirmado!";
                resultadoDiv.innerHTML = `
                    <p>¡Gracias por inscribirte! Introduce esta clave en el menú de Fortnite:</p>
                    <h2 style="background:#eee; padding:10px; display:inline-block;">${data.clave}</h2>
                `;
            } else {
                resultadoDiv.innerHTML = `<p style='color:red;'>Error: ${data.message || 'No se pudo validar el pago.'}</p>`;
            }
        }

        verificarPago();
    </script>
</body>
</html>
